<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-dark-ui.png" id="site-favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Portfolio of Armaghan Hasan — designer focused on digital design, art direction, and illustration."
    />
    <title>Portfolio | Armaghan Hasan</title>
    <script>
      (function () {
        const stored = localStorage.getItem("armaghan-theme") || "dark";
        const resolved =
          stored === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : stored;
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.style.colorScheme = resolved;

        var browserScheme = window.matchMedia("(prefers-color-scheme: dark)")
          .matches
          ? "dark"
          : "light";
        var favicon = document.getElementById("site-favicon");
        if (favicon) {
          favicon.href =
            browserScheme === "dark"
              ? "/favicon-dark-ui.png"
              : "/favicon-light-ui.png";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
